name: Build Android co-op APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'src/core/**'
      - 'src/gba/**'
      - 'src/gb/**'
      - 'src/third-party/**'
      - 'CMakeLists.txt'
      - 'version.cmake'
      - '.github/workflows/build-android-apk.yml'

concurrency:
  group: android-apk-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mGBA fork
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264 cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Keep the debug signing certificate stable across ephemeral GitHub
      # runners so each published APK can update the previous test build.
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-${{ github.repository }}-v1

      - name: Fetch SDL2 source
        run: |
          git clone --depth 1 --branch release-2.30.9 https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL2"

      - name: Build installable arm64 APK
        working-directory: src/platform/android
        env:
          SDL2_SRC: ${{ runner.temp }}/SDL2
          APP_VERSION_CODE: ${{ github.run_number }}
          # AGP locates the debug keystore at $ANDROID_SDK_HOME/.android when
          # that variable is set (setup-android exports it), which bypasses the
          # cached ~/.android/debug.keystore and mints a fresh key every build.
          # Point it home so all builds share the cached key.
          ANDROID_SDK_HOME: ${{ env.HOME }}
        run: ./build-apk.sh

      - name: Publish APK as a GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="android-coop-${{ github.run_number }}"
          gh release create "$tag" src/platform/android/app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "Heart & Soul Co-op Android Build ${{ github.run_number }}" \
            --notes "Installable arm64 Android test APK with the PC-server co-op client. Load the matching patched Heart & Soul ROM separately." \
            --latest=false
