name: Build Heart & Soul PC Server

on:
  push:
    branches: [master]
    paths:
      - "server/windows/**"
      - ".github/workflows/build-hns-pc-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained Windows executable
        run: >-
          dotnet publish server/windows/HnsPcServer.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o artifacts/HnsPcServer

      - name: Upload server executable
        uses: actions/upload-artifact@v4
        with:
          name: HnsPcServer-windows-x64
          path: artifacts/HnsPcServer/HnsPcServer.exe
          if-no-files-found: error
          retention-days: 30
