name: Build Android Co-op APK

on:
  push:
    paths:
      - "src/platform/android/**"
      - ".github/workflows/build-android-coop-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Fetch SDL2 source
        run: |
          git clone --depth 1 --branch release-2.30.11 https://github.com/libsdl-org/SDL.git "$GITHUB_WORKSPACE/SDL2"

      - name: Build installable arm64 debug APK
        working-directory: src/platform/android
        env:
          SDL2_SRC: ${{ github.workspace }}/SDL2
        run: |
          chmod +x build-apk.sh
          ./build-apk.sh

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: coop-android-${{ github.run_number }}
          name: Heart & Soul Co-op Android Test Build ${{ github.run_number }}
          body: |
            Installable arm64 Android test build of the mGBA frontend with the PC-server co-op link client.

            This release contains the emulator APK only. Load the matching patched Heart & Soul ROM separately.
          files: src/platform/android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: false
